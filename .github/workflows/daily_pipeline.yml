name: Daily Horror Story Pipeline

on:
  schedule:
    # Run daily at 06:15 AM (IST = UTC 00:45). Feel free to change.
    - cron: "45 0 * * *"
  workflow_dispatch: {}   # allow manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-horror
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      PYTHONUNBUFFERED: "1"
      STORY_API_MODE: gemini               # free tier from Google AI Studio
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VIDEO_ORIENTATION: vertical
      YOUTUBE_PRIVACY: public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + Devanagari fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          ls /usr/share/fonts/truetype/noto/ | grep -i deva || true

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download free background music (if configured)
        run: |
          if [ -n "$FREE_BG_MUSIC_URI" ]; then
            curl -L -o assets/bg_music/bg.mp3 "$FREE_BG_MUSIC_URI"
          fi
        env:
          FREE_BG_MUSIC_URI: ${{ secrets.FREE_BG_MUSIC_URI }}

      - name: Run daily horror pipeline
        run: python src/pipeline.py

      - name: List Gemini models (diagnostic - only on pipeline failure)
        if: ${{ failure() }}
        run: |
          echo "Models available to this key:"
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GOOGLE_AI_API_KEY" \
            | python -c "import sys,json;d=json.load(sys.stdin);print('\n'.join(sorted(m['name'] for m in d.get('models',[]))))" \
            || echo "Could not list models"
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}

      - name: Upload artifacts (videos for manual backup / review)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: today-output
          path: |
            output/**/*.mp4
            output/**/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Commit manifests & new stories back to repo
        if: ${{ always() && github.event_name != 'workflow_dispatch' }}
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add -A output/stories output/*/manifest_*.json
          git commit -m "daily horror: generated $(date +%F)" || echo "Nothing to commit"
          git push || echo "Nothing to push"
        continue-on-error: true
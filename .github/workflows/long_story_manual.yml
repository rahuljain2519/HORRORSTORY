name: Long Horror Story (On Demand)

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: "Upload privacy"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - private

permissions:
  contents: write

concurrency:
  group: long-story
  cancel-in-progress: false

jobs:
  build-long-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONUNBUFFERED: "1"
      STORY_API_MODE: gemini                # free tier from Google AI Studio
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VIDEO_ORIENTATION: horizontal         # 16:9 for long-form
      YOUTUBE_PRIVACY: ${{ inputs.privacy || 'public' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg + Devanagari fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download free background music (if configured)
        run: |
          if [ -n "$FREE_BG_MUSIC_URI" ]; then
            curl -L -o assets/bg_music/bg.mp3 "$FREE_BG_MUSIC_URI"
          fi
        env:
          FREE_BG_MUSIC_URI: ${{ secrets.FREE_BG_MUSIC_URI }}

      - name: Run long horror pipeline
        run: python src/pipeline_long.py

      - name: Upload artifacts (video for manual review)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: long-output
          path: |
            output/**/*.mp4
            output/**/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Commit long story back to repo
        if: ${{ always() }}
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add -A output/stories output/*/manifest_*.json
          git commit -m "long horror: generated $(date +%F)" || echo "Nothing to commit"
          git push || echo "Nothing to push"
        continue-on-error: true